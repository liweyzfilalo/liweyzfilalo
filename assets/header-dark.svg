<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Thomas Delhay, développeur">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#1b2621"/></pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#0b0f0d" stop-opacity="0"/><stop offset="1" stop-color="#0b0f0d"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="320" rx="22"/></clipPath>
  <style>
    .b1,.b2,.b3{transform-box:fill-box;transform-origin:center}
    .b1{animation:m1 14s ease-in-out infinite alternate}
    .b2{animation:m2 18s ease-in-out infinite alternate}
    .b3{animation:m3 16s ease-in-out infinite alternate}
    @keyframes m1{to{transform:translate(160px,40px) scale(1.15)}}
    @keyframes m2{to{transform:translate(-180px,-30px) scale(.9)}}
    @keyframes m3{to{transform:translate(90px,-60px) scale(1.2)}}
    .in{animation:in 1s cubic-bezier(.2,.7,.2,1)}
    .d1{animation-duration:1.3s} .d2{animation-duration:1.7s} .d3{animation-duration:2.1s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .ping{transform-origin:center;transform-box:fill-box;animation:ping 2.2s ease-out infinite}
    @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(2.8);opacity:0}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="320" fill="#0b0f0d"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="230" cy="60" r="150" fill="#5fd38d" fill-opacity="0.34"/>
    <circle class="b2" cx="1000" cy="250" r="170" fill="#3b82f6" fill-opacity="0.3"/>
    <circle class="b3" cx="720" cy="30" r="120" fill="#a78bfa" fill-opacity="0.26"/>
  </g>
  <rect width="1200" height="320" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="21.5" fill="none" stroke="#1f2b25"/>
</g>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <g class="in">
    <rect x="80" y="78" width="252" height="32" rx="16" fill="#0f1512" stroke="#1f2b25"/>
    <circle class="ping" cx="101" cy="94" r="5" fill="#5fd38d"/>
    <circle cx="101" cy="94" r="5" fill="#5fd38d"/>
    <text x="115" y="99.5" font-size="14" font-weight="600" fill="#93a39a">En ce moment : Velora Musique</text>
  </g>
  <text class="in d1" x="76" y="186" font-size="74" font-weight="800" letter-spacing="-2.5" fill="#ecf3ef">Thomas Delhay</text>
  <text class="in d2" x="80" y="228" font-size="24" font-weight="500" fill="#93a39a">Développeur · <tspan fill="#5fd38d" font-weight="700">BTS SIO option SLAM</tspan></text>
  <g class="in d3" font-family="'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#5b6b62">
    <text x="80" y="268"><tspan fill="#5fd38d">❯</tspan> web · windows · android · de l'interface au serveur<tspan class="cur" fill="#5fd38d"> ▍</tspan></text>
  </g>
</g>
</svg>