<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-label="Velora Board">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ec4899" stop-opacity="0.16"/><stop offset=".6" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ec4899" stop-opacity="0"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="r"><rect width="580" height="230" rx="18"/></clipPath>
  <style>
    .sweep{animation:sw 6s ease-in-out infinite}
    @keyframes sw{0%{transform:translateX(-580px)}60%,100%{transform:translateX(580px)}}
    .pulse{animation:pu 3.5s ease-in-out infinite alternate}
    @keyframes pu{from{opacity:.55}to{opacity:1}}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="580" height="230" fill="#ffffff"/>
  <rect class="pulse" width="580" height="230" fill="url(#glow)"/>
  <rect class="sweep" y="0" width="580" height="2" fill="url(#edge)"/>
</g>
<rect x=".5" y=".5" width="579" height="229" rx="17.5" fill="none" stroke="#dbe5df"/>
